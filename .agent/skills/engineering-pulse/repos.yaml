# Repos analyzed by /engineering-pulse.
#
# Adding a new repo: append a new entry. Required fields are `name`, `path`, and
# `integration_branches`. The skill counts only PRs merged into one of the
# integration branches (per-repo). Everything else (cross-feature-branch merges,
# WIP forks, etc.) is excluded.
#
# `name` is the short label used in tables and breakdowns. Keep it lowercase and
# stable — renaming a repo here means historical reports will read inconsistently.
#
# `source` (optional, default `gh-pr`) selects how contributions are counted:
#   - `gh-pr`   → count merged GitHub PRs into `integration_branches` (the default).
#   - `git-log` → the repo has NO GitHub PRs (work is squash-pushed straight to the
#                 integration branch). Count each non-merge commit on the integration
#                 branch as a PR-equivalent, deriving files/lines from `git log --numstat`
#                 and the author→engineer mapping from the commit author. Use this for
#                 personal-repo / direct-push workflows where `gh pr list` returns [].

repos:
  - name: audition
    path: /Users/USER/code/repos/vettedai-audition-supabase-version
    integration_branches: [main, lovable-staging]

  - name: congrats
    path: /Users/USER/code/repos/vetted-congrats-Flow-GENEROUS
    integration_branches: [main, verify-deployments]

  - name: backend
    path: /Users/USER/code/repos/backend-restructing
    integration_branches: [main, backend-verify-deployment]

  - name: nts
    path: /Users/USER/code/repos/nts-event-platform-supabase
    integration_branches: [main, staging]

  - name: onboarding
    path: /Users/USER/code/repos/vetted-engineering-onboarding
    integration_branches: [main, staging]

  # GTM prospecting tool frontend (Vetted-AI/vetted-gtm-frontend). Standard gh-pr repo,
  # feature branches merge to main via GitHub PRs. In scope from September 2026 payout
  # (Tobi, 2026-10-01 roster call) — was an August-report-only supplement before this.
  - name: gtm-frontend
    path: /Users/USER/code/repos/vetted-gtm-frontend
    integration_branches: [main]

  # Gaudensia's work also lands here (CDL Copilot — a separate product). Found missing
  # 2026-10-01 during the September payout run: she had 3 merged PRs here that were
  # silently "not measured" because this repo was never in the allowlist. Standard
  # gh-pr repo, personal-owned (tobilafinhangit/cdl-copilot) but has real team PRs.
  - name: cdl-copilot
    path: /Users/USER/code/repos/cdl-copilot
    integration_branches: [main, staging]

  # Joy's GTM prospecting tool, now org-owned (Vetted-AI/vetted-gtm, moved from
  # JoyyCLangat/vetted-gtm). Local clone folder is named vetted-gtm-backend (path
  # corrected 2026-10-01 — the old `vetted-gtm` path no longer exists on disk and
  # was silently "not measured" for at least one prior report cycle). No GitHub
  # PRs — work is squash-pushed straight to main referencing Fizzy cards. Counted
  # via git log, not `gh pr list` (which returns []). See `source: git-log` above.
  - name: gtm
    path: /Users/USER/code/repos/vetted-gtm-backend
    integration_branches: [main]
    source: git-log

  # Wisdom's QA-automation tool. Personal repo (wizzfi1/manual_qa), no GitHub PRs —
  # direct-push to `master`. Commits authored "Wisdom Shaibu" <shaibuwisdom@gmail.com>,
  # mapped to engineer `wizzfi1` via its `git_email` in engineers.yaml. This is the repo
  # that lets us gauge Wisdom's code bounty (Fizzy #1344 lineage).
  - name: manual-qa
    path: /Users/USER/code/repos/manual_qa
    integration_branches: [master]
    source: git-log

  # Elvis's QA-automation repo (Much1r1/Vetted_automation). Mixed workflow (some PRs,
  # mostly direct-push to main) + github-actions[bot] commits — git-log captures his full
  # output for ROI tracking; the bot commits map to no engineer and are dropped. Commits
  # authored "Much1r1"/"Elvis Muchiri" <muchirielvis375@gmail.com>, mapped via git_email.
  # Elvis is a retainer (QA) — this measures output for performance/ROI, NOT bounty payout.
  - name: vetted-automation
    path: /Users/USER/code/repos/Vetted_automation
    integration_branches: [main]
    source: git-log
