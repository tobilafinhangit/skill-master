# Ops & Review contribution rates — for work that doesn't show up as merged PRs but
# happens in Fizzy comments (skill-output runs, manual QA, ticket reviews).
#
# Rationale: most of these tasks are AI-assisted. The skill (pr-review, qa-handoff,
# ticket-review) does the heavy generation; the engineer's value is invoking it,
# sanity-checking, posting, and adding context. Manual QA is the exception — it's
# real testing-the-app time, less AI-assisted, so its rate is meaningfully higher.
#
# Skill-running rates should feel like a tip for invoking the tool (~$0.20–0.80),
# not a wage. The volume of generated prose is NOT a calibration input — a 23K-char
# ticket-review output is still ~5–10 minutes of human time to read and post. Don't
# price by output size; price by human time + judgment.
#
# If a category becomes very high-volume for a single engineer (~30+/month, sustained),
# treat that as a signal to formalize the role (flat monthly retainer for QA, etc.)
# rather than scaling the per-task rate up.
#
# `min_length` filters out short conversational comments (acks, pings, "for the fix
# it's this"). Tune up if false positives appear.

# Boards to scan for ops comments (authored by team members in the window).
# Add new boards here as the team takes on more surfaces.
boards:
  - id: 03faozjl3gdngcoyzpkr4vf87
    name: vetted
  - id: 03f58rc5c48jorujpxqp5da5b
    name: congrats
  - id: 03fque324yujb6i427s8o92r5
    name: talent-social
  - id: 03feaz5rc2t60wkn2rvjkhy6b
    name: product
  - id: 03fl735hqcd0h1pettl8o94oo
    name: bugs
  - id: 03fqeqfxt4s5h8spz9eyqf5vq
    name: vetted-onboarding
  - id: 03fwhvosyb36wblf0ugta4zf0
    name: qa-automation       # added 2026-05-30 (Fix 6) so Elvis's automation tracking is scanned
  - id: 03gggxqayxmjl6pjdleq7nijn
    name: engineering-operations   # added 2026-10-02: found via /boards.json during a board-drift check
    # Tobi flagged that Gaudensia's real September work "looks light" because she does
    # genuine engineering-operations work (scoping, security/privacy audits) that never
    # produces a PR. This board is where that work actually lives -- it had NEVER been
    # in this list, not even in the "deliberately not scanned" note below, meaning it
    # wasn't a considered exclusion, just a gap. Found two full cross-repo security
    # audits here (14,327 and 9,396 chars) worth 4,000 KES combined under the new
    # ops-deliverable category, invisible to every prior monthly report.
  - id: 03gplllzjyj0acg8vy1882dm7
    name: copilot             # added 2026-10-02, same board-drift check — cdl-copilot's
    # own Fizzy board (ticket creation/ownership for the repo already in repos.yaml)
# Not currently scanned (checked 2026-10-02 only for ONE engineer's activity, via
# /boards.json + a card-listing spot-check — NOT a full verification that no engineer
# does payable work here; re-check per the board-drift procedure below if anyone's
# number ever looks suspiciously low again):
#   Product Operations 03gf6uefbispz8xlnxpxi1ip5 (3 cards, 0 for the engineer checked) ·
#   Growth Team Board 03gjxd8zdfccug8lq7ddo7p0r (20 cards, 0 for the engineer checked) ·
#   Revenue Engine 03g73ysbcc871rlmp1i1owogb (0 cards) · VettedAI GTM 03ga0ytgjp086k2scipsjkyeh (0 cards) ·
#   Data Science 03ftd0879dj65en1lpvwv5a8v · Recruiters Ring 03gvnbc9odykwjoaaqxl0ifi1 ·
#   Nairobi Talent Social 03ggems4uusw5wieyycvlm1dk · Project Management Demo 03gj2wf7zi5fnjk01qk8wltke
# NOTE: `product` above (03feaz5rc2t60wkn2rvjkhy6b) is actually named "Feature Grooming |
# Product Team" in Fizzy's own UI — a stale label, not a stale board; it IS being scanned.

# Card-number scan range. Fizzy card numbers are global across the account and
# monotonically increasing. Each monthly run should cover the full active range.
# Adjust `high` periodically as the team accumulates more cards.
card_scan_range:
  low: 100
  high: 4300   # bumped 2026-10-01 for September payout: was 1750 (set 2026-07-01), silently
  #            missed every card from ~1751 onward for at least one prior report cycle.
  #            Binary-searched max existing card ≈4266 via GET /cards/{n}.json; re-check each run.

categories:
  pr-review:
    rate_kes: 40
    rate_effective_from: 2026-05-01  # was 30 KES Apr 2026; bumped after Daniella's Apr feedback re: technical-validation effort
    label: PR Review (skill-assisted)
    detect_any:
      - 'pr review:'
      - 'pr review —'
      - 'pr review report'
      - 'pr verification report'
      - 'pr verification —'
      - 'pr verification ━'
      - '🔍 pr review'
      - 'verdict from'
    detect_all:
      - any: ['ticket compliance', 'verdict', 'compliance check', 'exports / imports check', 'files changed']
    min_length: 600

  qa-handoff:
    rate_kes: 25
    label: QA Testing Guide (skill-assisted)
    detect_any:
      - 'qa testing guide'
    min_length: 600

  ticket-review:
    rate_kes: 75
    rate_effective_from: 2026-05-01  # was 50 KES Apr 2026; bumped to acknowledge longer reading + grooming-workflow context
    label: Ticket Review (panel skill)
    detect_any:
      - 'ticket review —'
      - 'ticket review report'
      - 'final ticket review'
    detect_all:
      - any: ['senior full-stack engineer', 'senior engineer', 'panel']
      - any: ['product manager', 'product designer', 'designer']
    min_length: 2000

  manual-qa:
    rate_kes: 200
    rate_effective_from: 2026-05-01  # was 150 KES Apr 2026; bumped to recognize real testing-the-app time + bug-finding value
    label: Manual QA Session
    detect_any:
      - 'qa report —'
      - 'qa report:'
      - 'qa result:'
      - 'tested on branch'
      - 'steps passed'
      - 'qa failed —'
      - 'qa passed'
      - 'qa manual testing'   # added 2026-07-01: Liban's #919 heading format missed the list (false negative)
      - 'manual testing –'
      - 'manual testing —'
      - 'qa report'           # added 2026-07-01: Wisdom's session formats (dash-agnostic)
      - 'qa update'
      - 'qa reply'
    min_length: 400
    # NOTE: 'manual ui/ux testing' deliberately does NOT belong in this list —
    # see the separate `uiux-testing` category below. It used to be in this list,
    # which silently double-priced a cheaper category at the deeper 200 KES rate
    # for at least one full month (found + fixed 2026-10-02, see uiux-testing note).

  # Lighter "assigned manual pass" QA category — distinct from manual-qa above.
  # Policy (Tobi, 2026-08-01, reports/engineering-pulse/2026-07-payout.md
  # Addendum 6/7): an "assigned manual QA/UI-UX pass" (e.g. filling in for a down
  # automation tool, or a lighter sign-off/sweep) pays HALF of a deep manual-qa
  # session — 100 KES vs 200 — "at observed ~15 min/card throughput, 100 ≈ double
  # an equivalent coding hour; 200 would have been ~triple." Created specifically
  # because Wisdom's and Liban's real manual UI/UX sweeps were either missed
  # entirely (format matched no detector) or, worse, matched the manual-qa
  # keyword list and got paid at 2x the correct rate.
  #
  # CRITICAL companion rule, same addendum, NOT a detector concern — a judgment
  # call every run must apply: "when the tool works, its runs pay nothing per-card
  # (engine bounty covers them); assigned manual passes pay the uiux rate." A
  # comment that is the automation tool's own unsupervised output (explicit
  # "Automated QA" label, or strong circumstantial evidence — e.g. multiple
  # distinct substantive reports posted mere seconds apart, a known no-human-could-
  # do-that tell) pays ZERO, not 100 and not 200 — that output is already
  # compensated via the engineer's code bounty on the automation repo (see the
  # manual-qa / vetted-automation `bounty_multiplier: 0.5` note in repos.yaml,
  # which exists for exactly this double-pay risk). Only a genuinely human-
  # performed assigned pass pays the 100 KES rate here.
  uiux-testing:
    rate_kes: 100
    rate_effective_from: 2026-08-01
    label: Manual UI/UX Testing Pass
    # AUTOMATION ROYALTY OVERRIDE (Tobi, 2026-10-02): if an engineer has
    # `automation_royalty_kes_month` set in engineers.yaml, their matches on THIS
    # category that are the tool's own self-labeled output (e.g. the exact "qa
    # sign-off" / "automated qa" keywords below) are excluded from per-card pricing
    # here entirely — paid instead as that flat monthly royalty, a subscription fee
    # for the tool existing, not labor pay per card. Only matches with NO automation
    # self-label (plain unlabeled prose, or an explicit human/in-app-browser marker)
    # still price per-card at the rate below. See Wisdom Shaibu's engineers.yaml entry
    # for the first instance of this — his manual_qa tool runs a routine UI/UX pass
    # that self-labels "QA sign-off"/"Manual UI/UX", which is what triggered this rule.
    detect_any:
      - 'qa sign-off'
      - 'manual verification'   # added 2026-08-01: Liban's #700 etc. heading format (Addendum 7)
      - 'manual ui/ux testing'
      - 'ui testing sign-off'
    min_length: 200
    # This category WAS live in July/August (see reports/engineering-pulse/2026-07-payout.md
    # Addendum 6/7 and reports/payouts/2026-08/2026-08_wizzfi1.md) but was missing from
    # this file entirely by September 2026 — restored 2026-10-02 after the user's own
    # memory flagged "something was off with the version of the skill we had" and this
    # was found in the same systematic audit that recovered the bounty_multiplier fix.
    # The skill's v3.5-restoration (recovering a dangling orphan commit, this same cycle)
    # evidently restored a version predating this category's creation.

  # QA verdict detection (Fix 3, 2026-05-30). This is a CAPACITY signal (tickets
  # tested), NOT a paid category — surfaced in the "Capacity & Invisible Work"
  # section, not the ops payable total.
  #
  # WHY a separate detector: the `manual-qa` keywords above missed ~97% of Elvis's
  # work. He posts verdicts as `TICKET #X — QA REVIEW SIGN-OFF` / `QA BLOCK` /
  # `UI TESTING SIGN-OFF`, none of which match the narrow manual-qa prose. May
  # reality: 227 QA-verdict comments across 190 distinct cards vs 7 the old
  # detector found. For qa-role engineers, do NOT rely on the manual-qa keywords —
  # use the structural + format-tolerant signals below.
  qa-verdict:
    surface: qa_verdict           # tells the scanner: structural column-move + format-tolerant regex
    measure: tickets_tested       # a COUNT for Capacity & Invisible Work, not a paid subtotal
    # Primary (structural): card moved INTO or OUT OF any QA column below = a QA
    # action regardless of comment wording. Column IDs from
    # .claude/rules/fizzy-api-patterns.md. This is the robust signal — it does not
    # depend on prose at all.
    qa_column_ids:
      - 03fnl3h1becpuazzhahxbn208  # Bugs board — QA
      - 03fdi5xotshcmiuqk8pj24b23  # Vetted board — QA
      - 03f58rxrkofln7o86yce47gvk  # Congrats board — QA
      - 03fmdk5fq40na6wnq23o2itge  # Product board — QA to be confirmed
    # Secondary (format-tolerant regex, case-insensitive): catches verdicts even
    # when the card wasn't moved (comment-only sign-off / block).
    verdict_regex: 'qa (review )?sign-?off|qa block|ui testing sign-?off|qa engineer:\s*\w'
    # Optionally split pass vs fail for the Capacity row (block/fail vs sign-off/pass):
    block_regex: 'qa block|qa fail'
    signoff_regex: 'qa (review )?sign-?off|ui testing sign-?off|qa pass'

  # Production triage tickets — opened on the Bugs board after running
  # alerts-vetted / alerts-congrats / troubleshooting skills. These don't
  # show up as comments; detection looks at *card creations* on the Bugs board
  # (and others listed below) by the engineer's fizzy_user_id.
  prod-triage:
    rate_kes: 75
    label: Production Triage Report
    surface: card_creation        # tells the scanner to look at cards.creator, not comments
    boards: [03fl735hqcd0h1pettl8o94oo]  # bugs board only; expand if other surfaces start receiving these
    title_detect_any:
      - 'troubleshooting report'
      - 'production system failures'
      - 'production audition errors'
      - 'webhook timeout'
      - 'system health alerts'
    # No body length filter — prod-triage cards are recognized by title pattern.

  # Substantial written analytical deliverables — security/privacy audits, cross-repo
  # investigations, strategic scoping writeups — that live as Fizzy comments on an
  # ENGINEERING-OPERATIONS-style board (not a code repo, no PR, no "manual-qa" keyword
  # match) but represent real, serious work. Added 2026-10-02 after Gaudensia Akinyi's
  # two September security audits (#3774 Resume PII Protection, #3775 Support/Eval
  # Privacy Verification — 14,327 and 9,396 chars of systematic cross-repo findings)
  # turned out to be sitting on a board (`engineering-operations`) that wasn't even
  # scanned, and would have been priced at 0 even if it had been (no existing category
  # fits "a 14K-character security audit"). Tier like code bounty — depth/impact, not
  # raw character count, same deflation-bias default (when unsure, lower tier wins).
  ops-deliverable:
    label: Engineering-Ops Analytical Deliverable
    surface: manual_tier            # the manager (or a careful agent read) assigns the
    #                                  tier by reading the actual deliverable — this is
    #                                  NOT a keyword-detectable category; don't try to
    #                                  auto-price it off length or keywords alone.
    tiers:
      S: {rate_kes: 500,  profile: "Single finding, one repo, light writeup"}
      M: {rate_kes: 1000, profile: "A few findings, 2-3 repos, moderate depth"}
      L: {rate_kes: 2000, profile: "Systematic cross-repo audit, executive findings section"}
      XL: {rate_kes: 3500, profile: "Major strategic deliverable that changes team direction/scope"}
    boards: [03gggxqayxmjl6pjdleq7nijn]  # engineering-operations; expand if this recurs elsewhere
    # Process: read the full deliverable, assign the tier conservatively, name the card
    # number and tier rationale explicitly in the report (same evidence-trail discipline
    # as the ticket-level bounty tables) — never silently fold this into a generic
    # "uncategorized ops" bucket, which is how it went unpriced for a full month already.

# Comments that don't match any category but exceed `track_other_min_length` are
# logged in the team payout report under "uncategorized ops" so the manager can
# spot-check whether new categories should be added.
track_other_min_length: 800
