# Engineer registry for /engineering-pulse --pre-invoice mode.
#
# Each entry produces one per-engineer bounty statement when --pre-invoice runs.
# Engineers absent from this file are still counted in the team-wide payout report
# (their PRs and bounty are calculated) but no statement is generated for them —
# that's how we keep the file authoritative without losing visibility on contributors
# we haven't onboarded into the invoice flow yet.
#
# `reference_initials` must be unique — it goes into the invoice reference code
# (e.g. GC-ENG-2026-04-DB). If two engineers share initials, append a digit (DB, DB2).
#
# `fizzy_user_id` maps to the engineer's user ID inside Fizzy (37signals). Required
# for ops-contribution detection (pr-review / qa-handoff / ticket-review / manual QA
# comments authored by them). Discoverable by hitting any card's /comments.json and
# looking at `creator.id`. Leave blank if unknown — ops detection just won't include
# that engineer until it's filled in.
#
# `display_name` and `currency` populate the statement template. Payment details
# (M-Pesa number, bank account) are NOT stored here — those live with the engineer
# and go on their invoice. This file is safe to commit.
#
# `active` controls bounty eligibility:
#   - true  → counted in bounty + statement generated each period
#   - false → PRs still counted in team-wide stats, but no bounty assigned and no
#             statement generated. Use when the engineer is on the team but not
#             yet onboarded onto the bounty system, or has left.
#
# `bounty_start_date` is the date the engineer's bounty agreement took effect.
# The pulse skill filters PRs / comments / card creations to (>= start_date)
# when computing that engineer's totals. If the field is missing or null, no
# filter is applied (treat as "always eligible" — usual case for long-tenured
# folks). YYYY-MM-DD format. Inclusive of the start date itself.
#
# `employment` declares how the engineer is paid:
#   - bounty   → bounty + ops figure is PAYABLE (behaves as before; the default
#                when the field is absent)
#   - retainer → engineer is on a fixed monthly retainer that does NOT stack with
#                bounty. Their computed bounty + ops renders as "Shadow-bounty
#                (not paid — retainer)" and is EXCLUDED from team total payable.
#                Shadow-bounty is a FLOOR, not a ceiling — infra/security/
#                investigation work is systematically under-measured by line/task
#                proxies, so a low shadow figure is NOT a verdict. See the
#                "Capacity & Invisible Work" section + the per-engineer value note.
# `retainer_kes_month` — the monthly retainer amount (null/omit for bounty engineers).
# `retainer_role` — engineering | qa.
#   - engineering → measured via PRs + ops (rendered as shadow-bounty).
#   - qa          → suppress the PR/shadow-bounty entirely; measured on QA
#                   throughput (manual-QA sessions + tickets tested) via the
#                   structural proxies in "Capacity & Invisible Work". A QA
#                   retainer with near-zero QA throughput in the window is a flag
#                   to surface, not a number to compute.
# `value_note` (retainer engineers only, optional) — a 1–2 line free-text note the
#   manager fills monthly, rendered verbatim into the Management Insights value-note
#   field. This is the only judgement of an infra/security engineer's value that
#   should carry weight — the shadow-bounty is a FLOOR, never a ceiling. Leave blank
#   and the report prints a placeholder prompting the manager to fill it.

